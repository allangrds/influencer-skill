<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TOPIC_TITLE}} — {{NETWORK}}</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Source box and legend: for the creator only, never recorded or published. */
  @media print { .source-ref { display: none; } }
</style>
<!--
  Label, legend and field names go in the content's language, e.g.
    pt: "📎 Fonte — não faz parte do texto" · "O que diz" · "⚠️ Atenção" · "Conferir"
    en: "📎 Source — not part of the text" · "What it says" · "⚠️ Note" · "Check"

  Legend: once at the top of each section that has source boxes.
  <p class="source-ref mb-3 rounded-md border border-amber-300 bg-amber-50 px-3 py-2 text-sm text-amber-900">📎 {LEGEND: the amber boxes are fact-checking notes with what the source says and its full reference; they are not part of the content; remove them before publishing}</p>

  Source box: right after each piece of content that uses the research. Keep it on one
  line inside whitespace-pre-wrap blocks. The note field only when needed. The check
  field holds the full reference of every source (book, article, review, study, news,
  official page, Bible) in the brand's citation style, the URL linked inside it;
  several separated by " · ".
  <div class="source-ref not-prose my-3 rounded-md border-l-4 border-amber-500 bg-amber-50 px-4 py-3 text-sm text-amber-950 font-sans not-italic whitespace-normal"><p class="text-xs font-bold uppercase tracking-wide text-amber-700">📎 {LABEL}</p><p class="mt-1"><strong>{WHAT IT SAYS}:</strong> …complete paraphrase, verbatim excerpts in quotes with the page…</p><p class="mt-1"><strong>⚠️ {NOTE}:</strong> …caveats…</p><p class="mt-1"><strong>{CHECK}:</strong> {full reference in the brand's citation style, with the URL as <a href="URL" target="_blank" rel="noopener" class="text-amber-800 underline break-all">URL</a>}</p></div>
-->
</head>
<body class="bg-gray-50 text-gray-900">
  <main class="max-w-3xl mx-auto p-8 space-y-10">
    <header class="space-y-1">
      <p class="text-sm uppercase tracking-wide text-gray-500">{{NETWORK}} — post</p>
      <h1 class="text-3xl font-bold">{{TOPIC_TITLE}}</h1>
    </header>

    <section>
      <h2 class="text-xl font-semibold mb-3 border-b pb-1">Visual Concept</h2>
      <div class="prose max-w-none whitespace-pre-wrap leading-relaxed">
        {{VISUAL_CONCEPT}}
      </div>
    </section>

    <section>
      <h2 class="text-xl font-semibold mb-3 border-b pb-1">Caption &amp; Hashtags</h2>
      <div class="prose max-w-none whitespace-pre-wrap leading-relaxed">
        {{CAPTION_TEXT}}
      </div>
    </section>
  </main>
</body>
</html>
