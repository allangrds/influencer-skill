<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TOPIC_TITLE}} — {{NETWORK}}</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <main class="max-w-3xl mx-auto p-8 space-y-10">
    <header class="space-y-1">
      <p class="text-sm uppercase tracking-wide text-gray-500">{{NETWORK}}</p>
      <h1 class="text-3xl font-bold">{{TOPIC_TITLE}}</h1>
    </header>

    <section>
      <h2 class="text-xl font-semibold mb-3 border-b pb-1">Video Script</h2>
      <div class="prose max-w-none whitespace-pre-wrap leading-relaxed">
        {{VIDEO_SCRIPT}}
      </div>
    </section>

    <section>
      <h2 class="text-xl font-semibold mb-3 border-b pb-1">Caption &amp; Hashtags</h2>
      <div class="prose max-w-none whitespace-pre-wrap leading-relaxed">
        {{CAPTION_TEXT}}
      </div>
    </section>
  </main>
</body>
</html>
